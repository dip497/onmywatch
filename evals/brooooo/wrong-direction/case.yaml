schema_version: "1.1"
name: brooooo-wrong-direction
tags: [brooooo]
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: "/onmywatch:brooooo why did you touch the tests"
  max_turns: 12
  allowed_tools: [Skill, Read, Edit, Write, Glob, Grep]
graders:
  - name: tests-restored
    type: regex
    weight: 2
    target: {source: file, path: tests/test_stats.py}
    pattern: 'def test_count_users\(\):'
    match: contains
  - name: test-split-undone
    type: regex
    weight: 1
    target: {source: file, path: tests/test_stats.py}
    pattern: 'test_empty_list|test_all_inactive'
    match: not_contains
  - name: rename-kept
    type: regex
    weight: 1
    target: {source: file, path: src/stats.py}
    pattern: 'user_count \+= 1'
    match: contains
  - name: logging-removed
    type: regex
    weight: 1
    target: {source: file, path: src/stats.py}
    pattern: 'logging|log\.debug'
    match: not_contains
  - name: owns-it-plainly
    type: llm
    weight: 2
    criteria: "The first one or two lines say what the user asked for and what the agent did instead. The reply does not argue that the earlier change was good and has no apology paragraph."
