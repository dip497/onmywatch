schema_version: "1.1"
name: brooooo-wrong-result
tags: [brooooo]
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: "/onmywatch:brooooo it still fails"
  max_turns: 12
  allowed_tools: [Skill, Read, Edit, Write, Glob, Grep]
graders:
  - name: fixed
    type: regex
    weight: 2
    target: {source: file, path: shop.py}
    pattern: 'percent\s*/\s*100|/\s*100'
    match: contains
  - name: owns-false-claim
    type: llm
    weight: 2
    criteria: "The reply says plainly that the earlier claim that the test passed was wrong or unchecked, states what is true now, and if it could not run the test it says so and gives the exact command to run, and has no apology paragraph or excuses."
