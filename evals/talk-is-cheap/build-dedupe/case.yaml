schema_version: "1.1"
name: talk-is-cheap-build-dedupe
tags: [talk-is-cheap]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Implement find_duplicate_emails in app/users.py."
  max_turns: 8
  allowed_tools: [Skill, Read, Edit, Write, Glob, Grep]
graders:
  - name: hash-structure
    type: regex
    weight: 2
    target: {source: file, path: app/users.py}
    pattern: "set\\(|Counter|defaultdict|\\{\\}|dict\\("
    match: contains
  - name: no-nested-loop
    type: regex
    weight: 1
    target: {source: file, path: app/users.py}
    pattern: "for [^\\n]+\\n\\s+for "
    match: not_contains
  - name: normalises-email
    type: regex
    weight: 2
    target: {source: file, path: app/users.py}
    pattern: "lower\\(\\)|casefold\\(\\)"
    match: contains
  - name: trims-email
    type: regex
    weight: 1
    target: {source: file, path: app/users.py}
    pattern: "strip\\(\\)"
    match: contains
