schema_version: "1.1"
name: talk-is-cheap-hotfix-duplicated-rule
tags: [talk-is-cheap]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "HOTFIX, we deploy in 10 minutes: order_total in app/orders.py crashes with KeyError 'tier' for guest users, who have no tier key. Guests pay full price. Make the smallest safe fix."
  max_turns: 10
  allowed_tools: [Skill, Read, Edit, Write, Glob, Grep]
graders:
  - name: fixed
    type: regex
    weight: 2
    target: {source: file, path: app/orders.py}
    pattern: "get\\(\\s*.tier"
    match: contains
  - name: note-later
    type: llm
    weight: 2
    criteria: >-
      The reply includes an architecture note pointing out that the same pricing rule is duplicated in
      app/invoice.py, which has the same crash, says it should be fixed or moved to one place, and marks
      that refactor for later or asks before doing it, rather than refactoring during the hotfix.
  - name: hotfix-small
    type: llm
    weight: 1
    criteria: >-
      The agent kept the change small. It did not create new modules or restructure code during the hotfix.
      Adding the same one-line guard to app/invoice.py is acceptable; a refactor is not.
