schema_version: "1.1"
name: just-tell-me-thanks
tags: [just-tell-me]
context:
  history_file: history.jsonl
execution:
  prompt: "thanks, that's all for today"
  max_turns: 3
  allowed_tools: [Read]
graders:
  - name: no-next-step
    type: llm
    weight: 2
    criteria: >-
      The reply is one or two short sentences, adds no next step, offer, recap or question, and does not invent more work.
